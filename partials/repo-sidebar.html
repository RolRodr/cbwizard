<aside id="repo-sidebar" class="repo-sidebar hidden" aria-label="Repository details">
    <div class="sidebar-header">
        <h3 class="sidebar-title">Repository</h3>
    </div>

    <div class="sidebar-body">
        <!-- Repo identity -->
        <div class="sidebar-section">
            <div class="sidebar-repo-name" id="sidebar-repo-name">—</div>
            <a id="sidebar-repo-link" href="#" target="_blank" rel="noopener noreferrer"
                class="sidebar-repo-link hidden">
                View on GitHub <i data-lucide="external-link" aria-hidden="true" class="lucide-inline"></i>
            </a>
            <div id="sidebar-fork-source" class="sidebar-fork-source hidden"></div>
        </div>

        <hr class="sidebar-divider">

        <!-- Config summary -->
        <div class="sidebar-section">
            <h4 class="sidebar-section-title">Configuration</h4>
            <dl class="sidebar-meta" id="sidebar-config-list">
                <div class="sidebar-meta-item">
                    <dt>Title</dt>
                    <dd id="sidebar-config-title" class="sidebar-meta-value">—</dd>
                </div>
                <div class="sidebar-meta-item">
                    <dt>Tagline</dt>
                    <dd id="sidebar-config-tagline" class="sidebar-meta-value">—</dd>
                </div>
                <div class="sidebar-meta-item">
                    <dt>Metadata</dt>
                    <dd id="sidebar-config-metadata" class="sidebar-meta-value">—</dd>
                </div>
            </dl>
        </div>

        <hr class="sidebar-divider">

        <!-- Files summary -->
        <div class="sidebar-section">
            <h4 class="sidebar-section-title">Files</h4>
            <dl class="sidebar-meta">
                <div class="sidebar-meta-item">
                    <dt>CSV</dt>
                    <dd>
                        <span id="sidebar-csv-status" class="sidebar-meta-value">Not uploaded</span>
                        <a href="#" id="sidebar-csv-preview-btn" class="sidebar-action-link hidden"
                            style="display:block; margin-top:6px; font-size:12.5px; color: var(--link-color);">View
                            current CSV data</a>
                    </dd>
                </div>
                <div class="sidebar-meta-item">
                    <dt>Media</dt>
                    <dd id="sidebar-media-count" class="sidebar-meta-value">0 files</dd>
                </div>
            </dl>
        </div>

        <hr class="sidebar-divider">

        <!-- Pages status -->
        <div class="sidebar-section">
            <h4 class="sidebar-section-title">GitHub Pages</h4>
            <div id="sidebar-pages-status" class="sidebar-pages-status">
                <span class="sidebar-status-dot sidebar-status-dot--unknown"></span>
                Not configured
            </div>
        </div>
    </div>
</aside>
